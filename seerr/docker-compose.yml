# Seerr (LAN only), the request UI formerly known as Jellyseerr
#
# Web UI: http://<host>:5055 (first access runs the setup: sign in with
# Jellyfin, then add Radarr and Sonarr).
# A request creates the monitored movie in Radarr or show in Sonarr, which
# search and download it; Seerr only follows it until it is in Jellyfin.
# Config lives in the named volume seerr-config. The image runs as node
# (1000:1000) and owns /app/config.
# Joins the external network tide (`docker network create tide`), so it reaches
# jellyfin, radarr and sonarr by name.
#
# The CPU/memory caps keep it from starving the other workloads
# of the host.

services:
  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    restart: always
    init: true
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "5055:5055"
    volumes:
      - seerr-config:/app/config
    networks:
      - tide
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${SEERR_CPUS:-1}"
          memory: ${SEERR_MEMORY:-1G}
        reservations:
          memory: 128M

volumes:
  seerr-config:

networks:
  tide:
    external: true

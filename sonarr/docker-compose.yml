# Sonarr (LAN only)
#
# Web UI: http://<host>:8989 (first access asks for an authentication method).
# Shows: searches through Prowlarr, sends the release to qBittorrent with the
# category sonarr, then renames and moves it into /data/shows and notifies Jellyfin.
# ${MEDIA_DIR} is mounted whole at /data, the same path qBittorrent sees, so the
# import is an instant rename (a move across two bind mounts would be a copy).
# Config lives in the named volume sonarr-config.
# Joins the external network tide (`docker network create tide`).
#
# The CPU/memory caps keep it from starving the other workloads
# of the host.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: always
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - ${MEDIA_DIR:?set MEDIA_DIR in .env}:/data
    networks:
      - tide
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${SONARR_CPUS:-1}"
          memory: ${SONARR_MEMORY:-1G}
        reservations:
          memory: 128M

volumes:
  sonarr-config:

networks:
  tide:
    external: true
